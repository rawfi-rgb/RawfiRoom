name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 문법 검사
        run: for f in server.js public/js/*.js; do node --check "$f"; done
      - name: 서버 실행 확인
        run: |
          node server.js & sleep 2
          curl -fsS http://localhost:8787/ | grep -q RawfiRoom
          curl -fsS http://localhost:8787/api/config | grep -q iceServers
          curl -fsS -X POST http://localhost:8787/api/rooms | grep -q hostKey
          echo "server ok"
